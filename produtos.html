
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDAI | Produtos</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: #fff;
}
.container { max-width: 850px; margin: auto; }
a { color: #a78bfa; text-decoration: none; }
h1 { margin-bottom: 8px; }
p { color: #aab2c5; }
.card {
  background: #151d32;
  padding: 22px;
  border-radius: 14px;
  margin-top: 24px;
}
label { display: block; margin: 16px 0 7px; }
input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #34415c;
  border-radius: 8px;
  background: #0b1020;
  color: white;
  font-size: 16px;
}
textarea { min-height: 90px; }
button {
  margin-top: 18px;
  padding: 14px 20px;
  border: 0;
  border-radius: 8px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}
.product {
  padding: 15px;
  margin-top: 12px;
  background: #202b44;
  border-radius: 9px;
}
.delete {
  background: #9f3345;
  margin-top: 10px;
}
.status {
  color: #4ade80;
  font-size: 13px;
  margin-top: 12px;
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html">← Voltar ao painel</a>
  <h1>📦 Produtos</h1>
  <p>Cadastre e organize os produtos vendidos pela VENDAI.</p>

  <div class="card">
    <h2>Novo produto</h2>
    <form id="productForm">
      <label>Nome do produto</label>
      <input id="name" required placeholder="Ex.: Smartwatch">

      <label>Preço de venda (R$)</label>
      <input id="price" type="number" min="0" step="0.01" required placeholder="199.90">

      <label>Estoque disponível</label>
      <input id="stock" type="number" min="0" step="1" required placeholder="10">

      <label>Descrição</label>
      <textarea id="description" placeholder="Descreva seu produto"></textarea>

      <button type="submit">Cadastrar produto</button>
    </form>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>Produtos cadastrados</h2>
    <div id="products">Carregando produtos...</div>
  </div>
</div>

<script>
const STORAGE_KEY = "vendai_produtos";
const form = document.getElementById("productForm");
const products = document.getElementById("products");
const status = document.getElementById("status");

function carregarProdutos() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function salvarProdutos(lista) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    return true;
  } catch {
    status.textContent = "Não foi possível salvar. Verifique o armazenamento do navegador.";
    return false;
  }
}

function mostrarProdutos() {
  const lista = carregarProdutos();
  products.replaceChildren();

  if (lista.length === 0) {
    products.textContent = "Nenhum produto cadastrado.";
    return;
  }

  lista.forEach((produto, index) => {
    const item = document.createElement("div");
    item.className = "product";

    const nome = document.createElement("strong");
    nome.textContent = produto.name;

    const detalhes = document.createElement("p");
    detalhes.textContent =
      "Preço: R$ " + Number(produto.price).toFixed(2) +
      " | Estoque: " + produto.stock;

    const descricao = document.createElement("p");
    descricao.textContent = produto.description || "Sem descrição.";

    const excluir = document.createElement("button");
    excluir.className = "delete";
    excluir.textContent = "Excluir produto";
    excluir.type = "button";

    excluir.addEventListener("click", function() {
      const atualizados = carregarProdutos();
      atualizados.splice(index, 1);

      if (salvarProdutos(atualizados)) {
        mostrarProdutos();
        status.textContent = "Produto excluído com sucesso.";
      }
    });

    item.append(nome, detalhes, descricao, excluir);
    products.appendChild(item);
  });
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const produto = {
    name: document.getElementById("name").value.trim(),
    price: Number(document.getElementById("price").value),
    stock: Number(document.getElementById("stock").value),
    description: document.getElementById("description").value.trim()
  };

  const lista = carregarProdutos();
  lista.push(produto);

  if (salvarProdutos(lista)) {
    form.reset();
    mostrarProdutos();
    status.textContent = "Produto salvo com sucesso!";
  }
});

mostrarProdutos();
</script>
</body>
</html>
